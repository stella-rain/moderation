# Checks blocklist.json before it reaches every player (CLAUDE.md): strict JSON, sorted and
# unique lists, well-formed entries, and `version` bumped by 1 against the base commit's file.
# Moderation has no auto-merge, so nothing requires this check by name; Kade merges.
name: Blocklist check

on:
  push:
    branches: [main]
    paths: ["blocklist.json", "scripts/**", ".github/workflows/blocklist-check.yml"]
  pull_request:
    paths: ["blocklist.json", "scripts/**", ".github/workflows/blocklist-check.yml"]

permissions: {}

jobs:
  check:
    name: blocklist check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts -v
      - name: Read the base commit's blocklist.json
        env:
          # The PR's base, or the commit main was at before this push.
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git fetch --no-tags --depth 1 origin "$BASE"
          git show "$BASE:blocklist.json" > "$RUNNER_TEMP/base.json" || rm -f "$RUNNER_TEMP/base.json"
      - run: python3 scripts/blocklist_check.py blocklist.json --base "$RUNNER_TEMP/base.json"
